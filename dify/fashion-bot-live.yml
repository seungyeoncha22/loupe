app:
  description: 취향 기반 패션 추천 봇. 원하는 옷을 말하면 여러 브랜드의 상품을 번호와 함께 추천해요. 👍/👎나 "1번 좋아 2번 별로"로 평가해 두면 '다음 추천 보기'나 전부 평가했을 때 다음 추천에 반영해요. 가끔 새로운 스타일도 하나씩 제안해요. "코이세이오랑 비슷한 브랜드", "빈티지 좋아하는데 브랜드 추천해줘"처럼 브랜드도 찾을 수 있어요.
  icon: 🤖
  icon_background: '#FFEAD5'
  icon_type: emoji
  mode: advanced-chat
  name: 패션 추천 봇
  use_icon_as_answer_icon: false
dependencies:
- current_identifier: null
  type: marketplace
  value:
    marketplace_plugin_unique_identifier: langgenius/ollama:1.0.2@ef203a332d1b2b8952dbaa012be70be3e0a2d576b001489fb3b070efc970ffbe
    version: null
- current_identifier: null
  type: marketplace

        code: "import json\nimport re\n\n# insta-crawler/export_brand_similarity.py --yml 로 갱신되는 줄 (직접 고치지 말 것)\nBRAND_ALIASES = json.loads(r'''{\"niceghostclub.com\":{\"ko\":\"나이스고스트클럽\",\"en\":\"NICE GHOST CLUB\",\"aliases\":[\"나이스고스트클럽\",\"niceghostclub\",\"niceghostclubcom\"],\"tags\":[\"캐주얼\",\"키치\",\"레이어드\",\"빈티지\"]},\"mimthe.com\":{\"ko\":\"밈더\",\"en\":\"MIM THE WARDROBE\",\"aliases\":[\"밈더\",\"mimthewardrobe\",\"mimthecom\",\"mimthe\"],\"tags\":[\"스트릿\",\"캐주얼\",\"밀리터리\"]},\"secondsalt.com\":{\"ko\":\"세컨드솔트\",\"en\":\"SECONDSALT\",\"aliases\":[\"세컨드솔트\",\"secondsalt\",\"secondsaltcom\"],\"tags\":[\"페미닌\",\"레이어드\",\"빈티지\",\"스트릿\"]},\"enzoblues.com\":{\"ko\":\"엔조블루스\",\"en\":\"ENZO BLUES\",\"aliases\":[\"엔조블루스\",\"enzoblues\",\"enzobluescom\"],\"tags\":[\"70s\",\"아웃도어\",\"빈티지\"]},\"safarispot.kr\":{\"ko\":\"사파리스팟\",\"en\":\"SAFARISPOT\",\"aliases\":[\"사파리스팟\",\"safarispot\",\"safarispotkr\"],\"tags\":[\"캐주얼\",\"빈티지\"]},\"seezul.com\":{\"ko\":\"시즐\",\"en\":\"SEEZUL\",\"aliases\":[\"\

          -\\\\u002d\")\n    return \"\\n\\n<!--fashion-ui \" + text + \" -->\"\n\n\n\ndef _norm(text):\n    return re.sub(r\"[^0-9a-z가-힣]\", \"\", (text or \"\").lower())\n\n\ndef _uniq(items):\n    out = []\n    for x in items:\n        if x and x not in out:\n            out.append(x)\n    return out\n\n\ndef _mentions(q):\n    \"\"\"정규화된 문장 속 브랜드 도메인 (겹치면 긴 별칭 우선).\"\"\"\n    hits = []\n    for domain, brand in BRAND_ALIASES.items():\n        for alias in brand[\"aliases\"]:\n            for m in re.finditer(re.escape(alias), q):\n                hits.append((m.start(), m.end(), domain))\n    hits.sort(key=lambda h: (h[0], -(h[1] - h[0])))\n    out, last_end = [], -1\n    for h in hits:\n        if h[0] >= last_end:\n            out.append(h[2])\n            last_end = h[1]\n    return _uniq(out)\n\n\ndef _styles_in(text):\n    q = _norm(text)\n    found = []\n    for expr in sorted(STYLE_ALIASES, key=len, reverse=True):\n        if expr in q:\n            found += [t for t in STYLE_ALIASES[expr]\
          \ if t not in found]\n    return found\n\n\n# 웹사이트의 브랜드 저장 버튼: \"브랜드 저장 @lowear.co.kr\" / \"브랜드 저장 취소 @lowear.co.kr\" (브랜드 좋아요와 같은 점수)\nBRAND_SAVE_RE = re.compile(r\"브랜드\\s*저장(\\s*취소)?\\s*@([a-z0-9.\\-]+)\", re.I)\nCANCEL_RE = re.compile(r\"취소|해제|cancel|undo\", re.I)   # 웹사이트에서 눌린 \U0001F44D/\U0001F44E를 다시 누르면 \"1번 취소 #k3f9\"\n\n\ndef _sentiment(text):\n    \"\"\"1 좋아요, -1 별로, 0 평가 취소, None 감정 표현 없음\"\"\"\n    if CANCEL_RE.search(text or \"\"):\n        return 0\n    if NEG_RE.search(text or \"\"):\n        return -1\n    if POS_RE.search(text or \"\"):\n        return 1\n    return None\n\n\ndef parse_feedback(query, last_shown):\n    \"\"\"[(kind, key, value)] kind:\n      code  — 버튼 메시지 \"1번 좋아 #k3f9\": 코드로 상품을 찾는다 (예전 답변의 버튼이어도 그 상품)\n      n     — 직접 입력 \"1번 좋아\", \"1번이랑 3번 좋아\", \"첫 번째 거 좋아\": 최근 추천의 번호\n      brand — \"로웨어 느낌 별로\",  tag — \"빈티지 쪽이 좋아\\\"\"\"\"\n    events = []\n    nums = list(NUM_RE.finditer(query or \"\"))\n    if nums:\n        segs = [query[m.start():(nums[i\
          \ + 1].start() if i + 1 < len(nums) else len(query))] for i, m in enumerate(nums)]\n        sents = [_sentiment(seg) for seg in segs]\n        for i in range(len(sents) - 2, -1, -1):   # 감정 표현이 없는 번호는 뒤 번호의 감정을 따른다 (\"1번이랑 3번 좋아\")\n            if sents[i] is None:\n                sents[i] = sents[i + 1]\n        for m, seg, sent in zip(nums, segs, sents):\n            if sent is None:\n                continue\n            code = CODE_RE.search(seg)\n            if code:\n                events.append((\"code\", code.group(1), sent))\n            else:\n                n = int(m.group(1)) if m.group(1) else ORDINALS[m.group(2)]\n                if any(int(x.get(\"n\") or 0) == n for x in last_shown):\n                    events.append((\"n\", n, sent))\n        return events\n    sent = _sentiment(query)\n    code = CODE_RE.search(query or \"\")\n    if code and sent is not None:\n        return [(\"code\", code.group(1), sent)]\n    if not sent:   # 감정 표현이 없거나, 상품이 아닌 브랜드·스타일\
          \ '취소'는 처리하지 않는다\n        return events\n    brands = _mentions(_norm(query))\n    events += [(\"brand\", d, sent) for d in brands]\n    if not brands:\n        events += [(\"tag\", t, sent) for t in _styles_in(query)]\n    return events\n\n\ndef _bump(table, key, delta):\n    if key and delta:\n        table[key] = round(max(-SCORE_CLAMP, min(SCORE_CLAMP, float(table.get(key, 0)) + delta)), 2)\n\n\ndef main(query: str, prefs: dict, last_shown: list, explore_log: dict, item_index: dict) -> dict:\n    \"\"\"평가를 기록만 한다. 같은 상품을 다시 평가하면 마지막 평가로 덮어쓴다(이전 평가만큼 되돌리고 새 평가를 반영).\n    이전 평점은 item_index(코드 -> 상품, 평점)에 있어서 예전 답변의 상품도 덮어쓰기가 맞게 된다.\n    최근 추천(\U0001F50E 탐색 상품 포함)이 모두 평가됐고 이번 메시지에 최근 추천 상품의 평가가 있었으면 next=yes (바로 다음 추천).\n    최근 추천에 없는 예전 상품의 평가는 기록만 하고 이 판단에는 넣지 않는다.\"\"\"\n    prefs = prefs if isinstance(prefs, dict) else {}\n    p = {\n        \"brands\": dict(prefs.get(\"brands\") or {}), \"tags\": dict(prefs.get(\"tags\") or {}),\n        \"liked_urls\": list(prefs.get(\"\
          liked_urls\") or []), \"disliked_urls\": list(prefs.get(\"disliked_urls\") or []),\n        \"history\": list(prefs.get(\"history\") or []), \"saved_brands\": list(prefs.get(\"saved_brands\") or []),\n    }\n    log = dict(explore_log) if isinstance(explore_log, dict) else {}\n    for k in (\"shown\", \"liked\", \"disliked\"):\n        log[k] = int(log.get(k) or 0)\n    log[\"tags_shown\"] = list(log.get(\"tags_shown\") or [])\n    log[\"items\"] = [dict(x) for x in (log.get(\"items\") or [])]\n    items = [dict(x) for x in (last_shown or []) if isinstance(x, dict)]\n    index = {k: dict(v) for k, v in (item_index or {}).items() if isinstance(v, dict)} if isinstance(item_index, dict) else {}\n\n    save = BRAND_SAVE_RE.search(query or \"\")\n    if save:\n        # 브랜드 저장: 브랜드 +1, 그 브랜드 태그 +0.5 (브랜드 좋아요와 같음). 취소는 그만큼 되돌린다.\n        # 이미 저장한 브랜드를 또 저장하거나, 저장하지 않은 브랜드를 취소하면 아무것도 하지 않는다.\n        domain, cancel = save.group(2).lower(), bool(save.group(1))\n        delta = 0\n    \
          \    if not cancel and domain not in p[\"saved_brands\"]:\n            p[\"saved_brands\"].append(domain)\n            delta = 1\n        elif cancel and domain in p[\"saved_brands\"]:\n            p[\"saved_brands\"].remove(domain)\n            delta = -1\n        if delta:\n            _bump(p[\"brands\"], domain, BRAND_W * delta)\n            for t in BRAND_ALIASES.get(domain, {}).get(\"tags\", []):\n                _bump(p[\"tags\"], t, TAG_W * delta)\n            p[\"history\"] = (p[\"history\"] + [{\"kind\": \"brand_save\", \"brand\": domain, \"v\": delta}])[-MAX_LIST:]\n        return {\n            \"ui\": ui_block({\"type\": \"rating\", \"ratings\": {c: v[\"rating\"] for c, v in index.items() if int(v.get(\"rating\") or 0)}}),\n            \"prefs\": p, \"explore_log\": log, \"last_shown\": items, \"item_index\": index, \"next\": \"no\", \"reply\": ACK,\n            \"feedback\": [{\"kind\": \"brand_save\", \"key\": domain, \"v\": delta, \"explore\": False}],\n       \
          \ }\n\n    events = parse_feedback(query or \"\", items)\n    feedback, unknown_codes, rated_recent = [], [], False\n    for kind, key, v in events:\n        if kind in (\"code\", \"n\"):\n            if kind == \"code\":\n                code = key\n                recent = next((x for x in items if x.get(\"code\") == code), None)\n                entry = index.get(code) or recent\n            else:\n                recent = next(x for x in items if int(x.get(\"n\") or 0) == key)\n                code = recent.get(\"code\", \"\")\n                entry = index.get(code) or recent\n            if not entry:\n                unknown_codes.append(key)\n                continue\n            old = int(entry.get(\"rating\") or 0)   # 바꾸기 전에 이전 평점을 읽는다\n            if recent is not None:\n                recent[\"rating\"] = v\n                rated_recent = rated_recent or v != 0\n            if code in index:\n                index[code][\"rating\"] = v\n            if old == v:\n\
          \                continue\n            delta = v - old   # \U0001F44D(+1) 뒤 \U0001F44E(-1)면 -2: 처음부터 \U0001F44E 하나 누른 것과 같아진다\n            url, domain = entry.get(\"url\", \"\"), entry.get(\"domain\", \"\")\n            _bump(p[\"brands\"], domain, BRAND_W * delta)\n            for t in entry.get(\"tags\") or []:\n                _bump(p[\"tags\"], t, TAG_W * delta)\n            for lst in (\"liked_urls\", \"disliked_urls\"):\n                if url in p[lst]:\n                    p[lst].remove(url)\n            if v:\n                p[\"liked_urls\" if v > 0 else \"disliked_urls\"].append(url)\n            if entry.get(\"explore\"):\n                if old:\n                    log[\"liked\" if old > 0 else \"disliked\"] -= 1\n                if v:\n                    log[\"liked\" if v > 0 else \"disliked\"] += 1\n                for x in log[\"items\"]:\n                    if x.get(\"url\") == url:\n                        x[\"feedback\"] = v\n            p[\"history\"].append({\"\
          kind\": \"item\", \"n\": entry.get(\"n\"), \"url\": url, \"brand\": domain, \"v\": v,\n                                 \"explore\": bool(entry.get(\"explore\")), \"recent\": recent is not None})\n            feedback.append({\"kind\": \"item\", \"key\": url, \"v\": v, \"explore\": bool(entry.get(\"explore\")),\n                             \"tag\": entry.get(\"explore_tag\", \"\"), \"recent\": recent is not None})\n        elif kind == \"brand\":\n            _bump(p[\"brands\"], key, BRAND_W * v)\n            for t in BRAND_ALIASES.get(key, {}).get(\"tags\", []):\n                _bump(p[\"tags\"], t, TAG_W * v)\n            p[\"history\"].append({\"kind\": \"brand\", \"brand\": key, \"v\": v})\n            feedback.append({\"kind\": \"brand\", \"key\": key, \"v\": v, \"explore\": False})\n        else:\n            _bump(p[\"tags\"], key, 2 * TAG_W * v)\n            p[\"history\"].append({\"kind\": \"tag\", \"tag\": key, \"v\": v})\n            feedback.append({\"kind\": \"\
          tag\", \"key\": key, \"v\": v, \"explore\": False})\n    for k in (\"liked_urls\", \"disliked_urls\", \"history\"):\n        p[k] = p[k][-MAX_LIST:]\n\n    all_rated = bool(items) and all(int(x.get(\"rating\") or 0) for x in items)\n    if len(unknown_codes) == len(events) and unknown_codes:\n        reply = \"오래전 추천이라 그 상품을 찾지 못했어요. 최근 추천에서 평가해 주세요.\"\n    elif events:\n        reply = ACK\n    elif items:\n        reply = \"어떤 상품에 대한 평가인지 잘 모르겠어요. 상품 아래 \U0001F44D/\U0001F44E를 누르거나 \\\"1번 좋아\\\"처럼 말씀해 주세요.\"\n    else:\n        reply = \"평가할 추천이 아직 없어요. 원하는 옷을 말씀해 주시면 추천해 드릴게요.\"\n    return {\n        \"ui\": ui_block({\"type\": \"rating\", \"ratings\": {c: v[\"rating\"] for c, v in index.items() if int(v.get(\"rating\") or 0)}}),\n        \"prefs\": p,\n        \"explore_log\": log,\n        \"last_shown\": items,\n        \"item_index\": index,\n        \"next\": \"yes\" if rated_recent and all_rated else \"no\",\n        \"reply\": reply,\n        \"feedback\": feedback,\n\
          \    }\n"

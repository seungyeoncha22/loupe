          --\", \"-\\\\u002d\")\n    return \"\\n\\n<!--fashion-ui \" + text + \" -->\"\n\n\n\ndef _norm(text):\n    return re.sub(r\"[^0-9a-z가-힣]\", \"\", (text or \"\").lower())\n\n\ndef _find_brands(query):\n    \"\"\"질문에 나온 브랜드를 등장 순서대로 찾는다. 한글명, 영문명, 도메인을 공백·대소문자 무시하고 매칭.\"\"\"\n    q = _norm(query)\n    hits = []\n    for domain, brand in BRAND_DATA[\"brands\"].items():\n        for alias in brand[\"aliases\"]:\n            pos = q.find(alias)\n            if pos >= 0:\n                hits.append((pos, -len(alias), domain))\n    found = []\n    for _, _, domain in sorted(hits):\n        if domain not in found:\n            found.append(domain)\n    return found\n\n\ndef _find_styles(query):\n    q = _norm(query)\n    found = []\n    for expr in sorted(BRAND_DATA[\"style_aliases\"], key=len, reverse=True):\n        if expr in q:\n            found += [t for t in BRAND_DATA[\"style_aliases\"][expr] if t not in found]\n    return found\n\n\ndef _label(brand):\n    return \"{} ({})\"\
          .format(brand[\"ko\"], brand[\"en\"]) if brand.get(\"en\") else brand[\"ko\"]\n\n\ndef _cell(text):\n    \"\"\"표 칸 안에서 깨지는 문자(|, 줄바꿈, 대괄호) 정리.\"\"\"\n    return re.sub(r\"\\s+\", \" \", str(text or \"\")).replace(\"|\", \"/\").replace(\"[\", \"(\").replace(\"]\", \")\").strip()\n\n\ndef _price(value):\n    try:\n        return \"{:,}원\".format(int(float(value)))\n    except (TypeError, ValueError):\n        return \"\"\n\n\ndef _product_strip(products):\n    \"\"\"대표 상품을 한 줄짜리 마크다운 표로 만든다. Dify 채팅은 표를 가로 스크롤 영역에 넣고\n    표 안 이미지는 높이 200px 이하로 줄여 보여주므로, 상품이 옆으로 나란히 놓이고 넘치면 가로로 넘겨 볼 수 있다.\"\"\"\n    if not products:\n        return \"\"\n    images = [\"![{}]({})\".format(_cell(p[\"name\"]), p[\"image\"]) for p in products]\n    names = [\"[{}]({})\".format(_cell(p[\"name\"]), p[\"url\"]) for p in products]\n    prices = [_price(p.get(\"price\")) or \"-\" for p in products]\n    rows = [images, [\":---:\"] * len(products), names, prices]\n    return \"\\n\".join(\"| \" + \" | \".join(r)\
          \ + \" |\" for r in rows)\n\n\ndef _style_rank(tags):\n    \"\"\"요청 태그와 브랜드 태그의 IDF 가중 코사인 순위. 요청 태그가 브랜드 태그에서 차지하는 비중이 클수록 위.\n    (brand_profiles의 weight는 태그별 IDF라 브랜드마다 같은 값이므로, 브랜드별 비중은 코사인으로 본다)\n    점수가 같으면 브랜드 태그 목록에서 요청 태그가 앞쪽에 있는 브랜드를 위로.\"\"\"\n    idf = BRAND_DATA[\"tag_idf\"]\n    qn = math.sqrt(sum(idf.get(t, 0) ** 2 for t in tags)) or 1\n    out = []\n    for domain, b in BRAND_DATA[\"brands\"].items():\n        shared = [t for t in tags if t in b[\"tags\"]]\n        if not shared:\n            continue\n        bn = math.sqrt(sum(idf.get(t, 0) ** 2 for t in b[\"tags\"])) or 1\n        score = sum(idf.get(t, 0) ** 2 for t in shared) / (qn * bn)\n        pos = min(b[\"tags\"].index(t) for t in shared)\n        out.append((round(score, 3), -pos, domain, shared))\n    out.sort(reverse=True)\n    return out\n\n\ndef _closing(blocks):\n    # 메시지가 표로 끝나면 Dify 채팅에서 마지막 표가 그려지지 않는 경우가 있어(2026-10-16, 5번째 브랜드 상품 줄 누락)\n    # 표 뒤에 안내 문장을 한 줄 둔다\n    return \"\\n\\n---\\n\\n\"\
          .join(blocks) + \"\\n\\n브랜드 이름을 누르면 브랜드몰로, 상품 이름을 누르면 상품 페이지로 이동해요.\"\n\n\ndef _brand_block(rank, brand, title_suffix, detail_lines):\n    parts = [\"### {}. [{}]({}){}\".format(rank, _label(brand), brand[\"url\"], title_suffix), \"\\n\".join(detail_lines)]\n    strip = _product_strip(brand.get(\"products\", []))\n    if strip:\n        parts.append(strip)\n    return \"\\n\\n\".join(parts)\n\n\ndef _brand_card(rank, brand, score_label, score, tags, detail):\n    \"\"\"웹사이트 브랜드 캐러셀용 구조화 데이터.\"\"\"\n    return {\"rank\": rank, \"ko\": brand[\"ko\"], \"en\": brand.get(\"en\", \"\"), \"url\": brand[\"url\"], \"score_label\": score_label,\n            \"score\": score, \"tags\": tags, \"detail\": detail,\n            \"products\": [{\"name\": p[\"name\"], \"price\": _price(p.get(\"price\")), \"image\": p[\"image\"], \"url\": p[\"url\"]}\n                         for p in brand.get(\"products\", [])]}\n\n\ndef _style_answer(query):\n    \"\"\"(마크다운, 웹사이트용 데이터 또는 None)\"\"\"\n    tags\
          \ = _find_styles(query)\n    if not tags:\n        names = \", \".join(sorted(BRAND_DATA[\"tag_idf\"], key=lambda t: BRAND_DATA[\"tag_idf\"][t]))\n        return \"어떤 스타일을 좋아하시는지 조금 더 알려주세요. 예: 빈티지, 페미닌, 스트릿, 미니멀\\n\\n지금 찾을 수 있는 스타일: \" + names, None\n    ranked = _style_rank(tags)\n    if not ranked:\n        return \"{} 스타일 브랜드는 아직 없어요. 다른 스타일로 찾아볼까요?\".format(\", \".join(tags)), None\n    picked = ranked[:STYLE_TOP]\n    head = \"**{}** 스타일 브랜드 {}곳이에요. 요청한 스타일이 브랜드 태그에서 차지하는 비중이 큰 순서예요. 상품 줄은 옆으로 넘겨 볼 수 있어요.\".format(\n        \" · \".join(tags), len(picked))\n    if len(picked) < STYLE_MIN:\n        head += \" (이 스타일 브랜드가 아직 {}곳뿐이에요)\".format(len(picked))\n    blocks, cards = [head], []\n    for i, (score, _, domain, shared) in enumerate(picked, 1):\n        b = BRAND_DATA[\"brands\"][domain]\n        blocks.append(_brand_block(i, b, \" · 일치도 {:.2f}\".format(score), [\n            \"- 맞는 태그: {}\".format(\" · \".join(shared)),\n            \"- 브랜드 태그 전체: {}\".format(\" · \"\
          .join(b[\"tags\"])),\n        ]))\n        cards.append(_brand_card(i, b, \"일치도\", score, shared, \"브랜드 무드: \" + \" · \".join(b[\"tags\"])))\n    title = \"{} 스타일 브랜드\".format(\" · \".join(tags))\n    return _closing(blocks), {\"type\": \"brands\", \"mode\": \"style\", \"groups\": [{\"title\": title, \"brands\": cards}]}\n\n\ndef _unknown_brand(query):\n    \"\"\"DB에 없는 브랜드로 보이는 이름을 질문 앞부분에서 뽑는다 (\"마뗑킴이랑 비슷한 브랜드\" -> \"마뗑킴\").\"\"\"\n    m = BRAND_NAME_RE.match(query or \"\")\n    if not m:\n        return \"\"\n    name = re.sub(r\"(?:은|는|을|를|의)$\", \"\", m.group(1).strip())\n    if not name or name in NOT_BRAND_WORDS or len(name) > 30:\n        return \"\"\n    return name\n\n\ndef main(query: str, class_label: str) -> dict:\n    if str(class_label).strip() == STYLE_MODE:\n        text, data = _style_answer(query)\n        return {\"result\": text, \"brand_request\": \"\", \"ui\": ui_block(data) if data else \"\"}\n\n    found = _find_brands(query)\n    if not found:\n      \
          \  name = _unknown_brand(query)\n        if name:\n            # brand_request는 실행 기록(노드 출력)에 남는다. 호스트 파일로 옮기는 건 별도 스크립트가 할 일.\n            return {\"result\": \"**{}**은(는) 아직 데이터에 없는 브랜드예요. 추가 요청으로 기록해 둘게요.\\n\\n\"\n                              \"대신 좋아하는 스타일(예: 빈티지, 페미닌)을 말씀해 주시면 그 스타일 브랜드를 찾아드릴게요.\".format(name),\n                    \"brand_request\": name, \"ui\": \"\"}\n        names = \", \".join(b[\"ko\"] for b in BRAND_DATA[\"brands\"].values())\n        return {\"result\": \"어떤 브랜드와 비슷한 곳을 찾으시는지 브랜드 이름을 알려주세요.\\n\\n\"\n                          \"지금 비교할 수 있는 브랜드: \" + names, \"brand_request\": \"\", \"ui\": \"\"}\n    blocks, groups = [], []\n    for domain in found[:2]:\n        brand = BRAND_DATA[\"brands\"][domain]\n        part = [\"**{}** 기준으로 분위기가 비슷한 브랜드 {}곳이에요. 상품 줄은 옆으로 넘겨 볼 수 있어요.\".format(\n            _label(brand), len(brand[\"similar\"]))]\n        cards = []\n        for i, s in enumerate(brand[\"similar\"], 1):\n            tags = \" · \".join(s[\"common_tags\"\
          ]) if s[\"common_tags\"] else \"없음\"\n            target = dict(BRAND_DATA[\"brands\"].get(s[\"domain\"], {}), ko=s[\"ko\"], en=s[\"en\"], url=s[\"url\"])\n            part.append(_brand_block(i, target, \" · 유사도 {:.2f}\".format(s[\"score\"]), [\"- 공통 태그: {}\".format(tags), \"- \" + s[\"reason\"]]))\n            cards.append(_brand_card(i, target, \"유사도\", s[\"score\"], s[\"common_tags\"], s[\"reason\"]))\n        blocks.append(\"\\n\\n\".join(part))\n        groups.append({\"title\": \"{} 기준으로 분위기가 비슷한 브랜드\".format(_label(brand)), \"brands\": cards})\n    payload = {\"type\": \"brands\", \"mode\": \"similar\", \"groups\": groups}\n    return {\"result\": _closing(blocks), \"brand_request\": \"\", \"ui\": ui_block(payload)}\n"

          category\":\"상의\"},{\"tag\":\"레이어드\",\"domain\":\"misekiseoul.kr\",\"name\":\"Layered flip knit\",\"price\":108000,\"url\":\"https://misekiseoul.kr/product/layered-flip-knit-charcoal/511/\",\"image\":\"https://misekiseoul.kr/web/product/big/202601/b3cf41aa6021a3359086800d5839fa77.jpg\",\"category\":\"상의\"},{\"tag\":\"레이어드\",\"domain\":\"misekiseoul.kr\",\"name\":\"Raglan layered hoodie SET\",\"price\":128000,\"url\":\"https://misekiseoul.kr/product/raglan-layered-hoodie-set-black/3145/\",\"image\":\"https://misekiseoul.kr/web/product/big/202609/f6681c588d8d3447f01781be307a3635.jpg\",\"category\":\"상의\"},{\"tag\":\"유니크·아방가르드\",\"domain\":\"misekiseoul.kr\",\"name\":\"Asymmetric button shirt\",\"price\":108000,\"url\":\"https://misekiseoul.kr/product/asymmetric-button-shirt-black/1522/\",\"image\":\"https://misekiseoul.kr/web/product/big/202607/cf6a5720720773afd51b9722acbae807.jpg\",\"category\":\"상의\"},{\"tag\":\"유니크·아방가르드\",\"domain\":\"misekiseoul.kr\",\"name\":\"Unbalanced flow\
          \ mini skirt\",\"price\":98000,\"url\":\"https://misekiseoul.kr/product/unbalanced-flow-mini-skirt-black/536/\",\"image\":\"https://misekiseoul.kr/web/product/big/202601/a620de0b2092ec371046f5590f6bc72e.jpg\",\"category\":\"하의\"},{\"tag\":\"페미닌\",\"domain\":\"misekiseoul.kr\",\"name\":\"Folding collar shirring top\",\"price\":78000,\"url\":\"https://misekiseoul.kr/product/folding-collar-shirring-top-black/1441/\",\"image\":\"https://misekiseoul.kr/web/product/big/202603/39ab263a84d833cc8410a2aaca3f46e6.jpg\",\"category\":\"상의\"},{\"tag\":\"페미닌\",\"domain\":\"misekiseoul.kr\",\"name\":\"Wrap pleats button shirt\",\"price\":148000,\"url\":\"https://misekiseoul.kr/product/wrap-pleats-button-shirt-black/3149/\",\"image\":\"https://misekiseoul.kr/web/product/big/202609/316f9769a5b86c54b895754b7e553c44.jpg\",\"category\":\"상의\"},{\"tag\":\"스트릿\",\"domain\":\"misekiseoul.kr\",\"name\":\"Misekiseoul logo hoodie\",\"price\":108000,\"url\":\"https://misekiseoul.kr/product/misekiseoul-logo-hoodie-black/959/\"\
          ,\"image\":\"https://misekiseoul.kr/web/product/big/202509/e667cfbf77ce25ffbe2e105ef02c1fab.jpg\",\"category\":\"상의\"},{\"tag\":\"스트릿\",\"domain\":\"misekiseoul.kr\",\"name\":\"Chicano lettering short sleeve\",\"price\":68000,\"url\":\"https://misekiseoul.kr/product/chicano-lettering-short-sleeve-black/1773/\",\"image\":\"https://misekiseoul.kr/web/product/big/202604/66f3da38688f493222e97a249a71a5f1.jpg\",\"category\":\"상의\"},{\"tag\":\"스트릿\",\"domain\":\"misekiseoul.kr\",\"name\":\"Pixel miseki logo short sleeve\",\"price\":68000,\"url\":\"https://misekiseoul.kr/product/pixel-miseki-logo-short-sleeve-black/1937/\",\"image\":\"https://misekiseoul.kr/web/product/big/202607/62045e6c747c22decaa89cdf45c1425a.jpg\",\"category\":\"상의\"}]}''')\n\nEXPLORE_EVERY = 3   # 상품 추천 3번에 1번 탐색 추천\nMORE_BRANDS = 2     # \"이 스타일 브랜드 더 보기\"에 붙이는 브랜드 수\nMAX_LIST = 30\nMAX_INDEX = 150     # item_index(코드 -> 상품)에 남기는 상품 수. 이보다 오래된 답변의 버튼은 평가할 수 없다.\n# 추천 목록 맨 아래 버튼. 누르면 \"다음 추천 보기\"가 전송되고, 검색 준비 노드가\
          \ 같은 조건으로 다음 추천을 한다.\nNEXT_BUTTON = '<button data-variant=\"primary\" data-size=\"small\" data-message=\"다음 추천 보기\">다음 추천 보기 →</button>'\n\n\ndef _price(value):\n    try:\n        return \"{:,}원\".format(int(float(value)))\n    except (TypeError, ValueError):\n        return \"\"\n\n\ndef _md(text):\n    return str(text or \"\").replace(\"[\", \"(\").replace(\"]\", \")\")\n\n\ndef item_code(url):\n    \"\"\"상품 URL -> 4자리 코드 (FNV-1a 32비트를 base36으로). 버튼 data-message에 붙여 예전 답변의 버튼도 정확한 상품으로 평가한다.\n    \"추가 제안\", \"평가 기록\" 노드와 같은 함수여야 한다.\"\"\"\n    h = 2166136261\n    for b in str(url or \"\").encode(\"utf-8\"):\n        h = ((h ^ b) * 16777619) & 0xFFFFFFFF\n    out = \"\"\n    for _ in range(4):\n        h, r = divmod(h, 36)\n        out = \"0123456789abcdefghijklmnopqrstuvwxyz\"[r] + out\n    return out\n\n\ndef feedback_buttons(n, code):\n    \"\"\"Dify 채팅 마크다운의 <button data-message>는 누르면 그 문장을 사용자 메시지로 보낸다.\"\"\"\n    return ('<button data-variant=\"secondary\" data-size=\"small\"\
          \ data-message=\"{0}번 좋아 #{1}\">\U0001F44D 좋아요</button> '\n            '<button data-variant=\"secondary\" data-size=\"small\" data-message=\"{0}번 별로 #{1}\">\U0001F44E 별로</button>').format(n, code)\n\n\ndef _style_rank(tags):\n    \"\"\"요청 태그와 브랜드 태그의 IDF 가중 코사인 순위 (유사 브랜드 노드의 스타일 찾기와 같은 기준).\"\"\"\n    idf = EXTRAS_DATA[\"tag_idf\"]\n    qn = math.sqrt(sum(idf.get(t, 0) ** 2 for t in tags)) or 1\n    out = []\n    for domain, b in EXTRAS_DATA[\"brands\"].items():\n        shared = [t for t in tags if t in b[\"tags\"]]\n        if not shared:\n            continue\n        bn = math.sqrt(sum(idf.get(t, 0) ** 2 for t in b[\"tags\"])) or 1\n        out.append((sum(idf.get(t, 0) ** 2 for t in shared) / (qn * bn), -min(b[\"tags\"].index(t) for t in shared), domain, shared))\n    out.sort(reverse=True)\n    return out\n\n\ndef ui_block(payload):\n    \"\"\"웹사이트용 구조화 데이터를 답변 끝 HTML 주석으로 붙인다: <!--fashion-ui {...} -->\n    Dify 채팅은 sanitize 단계에서 HTML 주석을 지우므로 화면에 보이지 않는다.\n    주석이 중간에\
          \ 끝나지 않도록 JSON 문자열 안의 \"--\"를 \\\\u002d로 바꾼다 (JSON으로 읽으면 원래 값).\"\"\"\n    text = json.dumps(dict(payload, v=1), ensure_ascii=False, separators=(\",\", \":\")).replace(\"--\", \"-\\\\u002d\")\n    return \"\\n\\n<!--fashion-ui \" + text + \" -->\"\n\n\n\ndef with_taste(prefs, taste):\n    \"\"\"웹사이트가 새 대화 첫 메시지에 넘긴 '저장된 취향'(입력 변수 taste, JSON 문자열)을 바닥에 깔고\n    이 대화에서 한 평가(prefs)를 더한다. Dify는 첫 메시지의 입력을 대화 내내 유지하므로 모든 턴에서 같은 taste가 온다.\"\"\"\n    prefs = prefs if isinstance(prefs, dict) else {}\n    try:\n        base = json.loads(taste) if taste else {}\n    except Exception:\n        base = {}\n    base = base if isinstance(base, dict) else {}\n    out = dict(prefs)\n    for k in (\"brands\", \"tags\"):\n        merged = {}\n        for src in (base.get(k) or {}, prefs.get(k) or {}):\n            for key, v in (src.items() if isinstance(src, dict) else []):\n                try:\n                    merged[key] = round(max(-3.0, min(3.0, float(merged.get(key, 0)) + float(v))), 2)\n\
          \                except (TypeError, ValueError):\n                    pass\n        out[k] = merged\n    out[\"liked_urls\"] = list(dict.fromkeys(list(base.get(\"liked_urls\") or []) + list(prefs.get(\"liked_urls\") or [])))[-30:]\n    return out\n\n\ndef _more_brands(basis, skip_domains, prefs, turn):\n    \"\"\"스타일 순위에서 이번 답변에 없던 브랜드를 고른다. 매번 같은 브랜드가 나오지 않도록 추천 횟수만큼 순서를 돌린다.\n    (마크다운 줄, 웹사이트용 구조화 데이터)를 돌려준다.\"\"\"\n    lines, data = [], []\n    brand_pref = prefs.get(\"brands\") or {}\n    ranked = [r for r in _style_rank(basis) if r[2] not in skip_domains and float(brand_pref.get(r[2], 0)) >= 0]\n    if ranked:\n        k = ((turn - 1) * MORE_BRANDS) % len(ranked)\n        ranked = ranked[k:] + ranked[:k]\n    for _, _, domain, shared in ranked:\n        b = EXTRAS_DATA[\"brands\"][domain]\n        line = \"- [{} ({})]({}) · {}\".format(b[\"ko\"], b[\"en\"], b[\"url\"], \" · \".join(b[\"tags\"]))\n        p = b.get(\"product\")\n        if p:\n            line += \" — 대표 상품\
          \ [{}]({}) {}\".format(_md(p[\"name\"]), p[\"url\"], _price(p.get(\"price\")))\n        lines.append(line)\n        data.append({\"ko\": b[\"ko\"], \"en\": b[\"en\"], \"url\": b[\"url\"], \"tags\": b[\"tags\"],\n                     \"product\": {\"name\": p[\"name\"], \"url\": p[\"url\"], \"image\": p.get(\"image\", \"\"), \"price\": _price(p.get(\"price\"))} if p else None})\n        if len(lines) >= MORE_BRANDS:\n            break\n    return lines, data\n\n\ndef _pick_explore(seeds, current, category, skip_urls, skip_domains, exclude, prefs, tags_shown):\n    \"\"\"좋아한 태그(없으면 현재 스타일)와 브랜드 태그에서 자주 함께 나오는 이웃 태그 중 아직 안 보여준 태그를 골라,\n    그 태그의 근거 상품 하나를 고른다. 같은 카테고리, 이번 답변에 없던 브랜드를 우선한다.\"\"\"\n    tag_pref = prefs.get(\"tags\") or {}\n    brand_pref = prefs.get(\"brands\") or {}\n    disliked_tags = {t for t, v in tag_pref.items() if float(v) < 0}\n    counts = {}\n    for seed in seeds:\n        for nb, cnt in EXTRAS_DATA[\"neighbors\"].get(seed, []):\n            if nb not in\
          \ seeds and nb not in current and nb not in disliked_tags:\n                counts[nb] = counts.get(nb, 0) + cnt\n    fresh = sorted((t for t in counts if t not in tags_shown), key=lambda t: -counts[t])\n    again = sorted((t for t in counts if t in tags_shown), key=lambda t: -counts[t])\n    # 1회차: 같은 카테고리 상품이 있는 태그만, 2회차: 카테고리 무관\n    for same_category in ((True, False) if category else (False,)):\n        for tag in fresh + again:\n            pool = [x for x in EXTRAS_DATA[\"pool\"] if x[\"tag\"] == tag and x[\"url\"] not in skip_urls\n                    and x[\"domain\"] not in exclude and float(brand_pref.get(x[\"domain\"], 0)) >= 0\n                    and (not same_category or x[\"category\"] == category)]\n            if not pool:\n                continue\n            pool.sort(key=lambda x: x[\"domain\"] in skip_domains)\n            seed = next((s for s in seeds if tag in dict(EXTRAS_DATA[\"neighbors\"].get(s, []))), seeds[0])\n            return dict(pool[0], seed=seed)\n\
          \    return None\n\n\ndef update_index(index, items):\n    \"\"\"보여준 상품을 코드로 찾을 수 있게 쌓는다. 예전에 평가한 상품이 다시 나와도 그 평점은 유지한다\n    (같은 상품을 다시 평가할 때 덮어쓰기 계산에 쓴다). 최근 MAX_INDEX개만 남긴다.\"\"\"\n    index = {k: dict(v) for k, v in (index or {}).items() if isinstance(v, dict)}\n    for x in items:\n        prev = index.pop(x[\"code\"], {})\n        index[x[\"code\"]] = {\"n\": x[\"n\"], \"url\": x[\"url\"], \"domain\": x[\"domain\"], \"name\": x.get(\"name\", \"\"),\n                            \"tags\": x.get(\"tags\", []), \"explore\": bool(x.get(\"explore\")), \"explore_tag\": x.get(\"explore_tag\", \"\"),\n                            \"rating\": int(prev.get(\"rating\") or 0) if prev.get(\"url\") == x[\"url\"] else 0}\n    return dict(list(index.items())[-MAX_INDEX:])\n\n\ndef main(shown_items: list, shown_urls: list, styles: list, category: str, exclude: list,\n         prefs: dict, explore_log: dict, rec_count: float, item_index: dict,\n         cards: list, intro: str, relax_note: str,\
          \ reaction: str, taste: str) -> dict:\n    prefs = with_taste(prefs, taste)\n    log = dict(explore_log) if isinstance(explore_log, dict) else {}\n    log.setdefault(\"shown\", 0)\n    log.setdefault(\"liked\", 0)\n    log.setdefault(\"disliked\", 0)\n    log[\"tags_shown\"] = list(log.get(\"tags_shown\") or [])\n    log[\"items\"] = list(log.get(\"items\") or [])\n\n    items = [dict(x, tags=EXTRAS_DATA[\"brands\"].get(x.get(\"domain\"), {}).get(\"tags\", [])) for x in (shown_items or [])]\n    count = int(rec_count or 0) + (1 if items else 0)\n    urls = list(shown_urls or [])\n    shown_domains = {x[\"domain\"] for x in items}\n    liked_tags = [t for t, v in sorted((prefs.get(\"tags\") or {}).items(), key=lambda x: -float(x[1])) if float(v) > 0]\n    blocks, event, more_data, explore_card = [], {}, [], None\n\n    basis = list(styles or []) or liked_tags[:2]\n    if items and basis:\n        lines, more_data = _more_brands(basis, shown_domains | set(exclude or []), prefs, count)\n\
          \        if lines:\n            blocks.append(\"**이 스타일 브랜드 더 보기**\\n\\n\" + \"\\n\".join(lines))\n\n    seeds = liked_tags[:3] or list(styles or [])\n    if items and seeds and count % EXPLORE_EVERY == 0:\n        skip = set(urls) | set(prefs.get(\"disliked_urls\") or []) | {x[\"url\"] for x in items}\n        pick = _pick_explore(seeds, set(styles or []), category, skip, shown_domains, set(exclude or []), prefs, log[\"tags_shown\"])\n        if pick:\n            n = len(items) + 1\n            b = EXTRAS_DATA[\"brands\"].get(pick[\"domain\"], {})\n            why = \"좋아하신\" if liked_tags else \"지금 찾는\"\n            parts = [\n                \"### \U0001F50E 이런 스타일은 어때요?\",\n                \"{} {} 스타일과 자주 함께 나오는 **{}** 스타일이에요.\".format(why, pick[\"seed\"], pick[\"tag\"]),\n                \"![{}]({})\".format(_md(pick[\"name\"]), pick[\"image\"]),\n                \" · \".join(x for x in [\"**{}. {}**\".format(n, _md(pick[\"name\"])), b.get(\"ko\", \"\"), _price(pick.get(\"\
          price\"))] if x),\n                \"[상품 보러가기]({})\".format(pick[\"url\"]),\n                feedback_buttons(n, item_code(pick[\"url\"])),\n            ]\n            blocks.append(\"\\n\\n\".join(parts))\n            items.append({\"n\": n, \"code\": item_code(pick[\"url\"]), \"url\": pick[\"url\"], \"domain\": pick[\"domain\"], \"name\": pick[\"name\"],\n                          \"tags\": b.get(\"tags\", []), \"explore\": True, \"explore_tag\": pick[\"tag\"]})\n            urls.append(pick[\"url\"])\n            log[\"shown\"] += 1\n            log[\"tags_shown\"] = (log[\"tags_shown\"] + [pick[\"tag\"]])[-MAX_LIST:]\n            log[\"items\"] = (log[\"items\"] + [{\"url\": pick[\"url\"], \"tag\": pick[\"tag\"], \"seed\": pick[\"seed\"], \"feedback\": 0}])[-MAX_LIST:]\n            event = {\"tag\": pick[\"tag\"], \"seed\": pick[\"seed\"], \"url\": pick[\"url\"]}\n            explore_card = {\"n\": n, \"code\": item_code(pick[\"url\"]), \"name\": pick[\"name\"], \"brand\":\
          \ b.get(\"ko\", \"\"),\n                            \"price\": _price(pick.get(\"price\")), \"image\": pick[\"image\"], \"url\": pick[\"url\"],\n                            \"tag\": pick[\"tag\"], \"seed\": pick[\"seed\"], \"why\": parts[1].replace(\"**\", \"\"),\n                            \"category\": pick.get(\"category\", \"\"), \"domain\": pick[\"domain\"]}\n\n    block = (\"\\n\\n---\\n\\n\" + \"\\n\\n---\\n\\n\".join(blocks)) if blocks else \"\"\n    if items:\n        block += \"\\n\\n\" + NEXT_BUTTON\n    # 상품마다 대표 스타일 1개 (웹사이트 취향 지도의 스타일 동그라미): 이번 질문 스타일 → 좋아한 스타일 → 브랜드 무드 첫 번째.\n    # 탐색 상품은 탐색 스타일.\n    def main_style(tags):\n        for pool in (list(styles or []), liked_tags):\n            hit = next((t for t in pool if t in tags), None)\n            if hit:\n                return hit\n        return tags[0] if tags else ((styles or [\"\"])[0] if styles else \"\")\n    tags_by_code = {x[\"code\"]: x.get(\"tags\", []) for x in items}\n    styled_cards = [dict(c,\
          \ style=main_style(tags_by_code.get(c.get(\"code\"), []))) for c in (cards or [])]\n    if explore_card:\n        explore_card[\"style\"] = explore_card[\"tag\"]\n    index = update_index(item_index if isinstance(item_index, dict) else {}, items)\n    ui = ui_block({\n        \"type\": \"products\",\n        \"notice\": [t.strip() for t in (relax_note, reaction) if (t or \"\").strip()],\n        \"intro\": (intro or \"\").strip(),\n        \"items\": styled_cards,\n        \"explore\": explore_card,\n        \"more_brands\": more_data,\n        \"next\": bool(items),\n        \"ratings\": {code: v[\"rating\"] for code, v in index.items() if int(v.get(\"rating\") or 0)},\n    })\n    return {\n        \"ui\": ui,\n        \"block\": block,\n        \"last_shown\": items,\n        \"shown_urls\": urls[-MAX_LIST:],\n        \"rec_count\": count,\n        \"explore_log\": log,\n        \"explore_event\": event,\n        \"item_index\": index,\n    }\n"
        code_language: python3

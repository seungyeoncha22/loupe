          provider: langgenius/openrouter/openrouter
        model_selector: null
        prompt_template:
        - id: 56ffa17e-0432-461f-ba77-c9f1ceadec55
          role: system
          text: "사용자의 마지막 메시지를 쇼핑몰 상품 검색 조건으로 정리해. 아래 JSON만 출력해.\n{\"followup\": false, \"query\": \"검색어 한 줄\", \"styles\": [\"스타일\"], \"category\": \"상의|하의|아우터|기타|\", \"item\": \"아이템 종류\", \"brands\": [\"보고 싶다고 한 브랜드 이름\"], \"exclude_brands\": [\"제외할 브랜드 이름\"]}\n\n## 이전 검색 조건 (없으면 빈 값)\n{{#conversation.last_search#}}\n\n## followup (후속 질문 여부)\n- \"다른 거\", \"더 보여줘\", \"다른 빈티지한 아우터도 더\", \"더 밝은 색으로\", \"좀 더 싼 걸로\"처럼 이전 검색을 이어가는 질문이면 true.\n- 이전 검색 조건이 비어 있거나, 아이템 종류와 분위기가 모두 새로운 요청이면 false.\n- \"다음 추천 보기\"이거나 \"1번 좋아\", \"2번 별로\", \"OO 느낌 별로\"처럼 앞 추천을 평가하는 메시지면 true로 하고, query, styles, category, brands, exclude_brands는 이전 검색 조건 그대로 써. 평가에 나온 브랜드를 exclude_brands에 넣지 마.\n\n## query (검색어)\n- 아이템 종류는 비슷한 말을 같이 넣어. 예: 슬랙스 → 슬랙스 팬츠 바지 트라우저 slacks pants\n- 사용자가 말한 색, 소재, 핏, 분위기만 한국어와 영어를 같이 넣어. 예: 검정 블랙 black, 와이드 wide\n- 사용자가 말한 스타일·분위기는 반드시 한국어와 영어로 넣어. 예: \"빈티지한 아우터\" → \"빈티지 vintage 아우터 outer 자켓 jacket 코트 coat\"\n- 사용자가 말하지 않은 스타일·분위기 단어(빈티지, 캐주얼, 미니멀, 스트릿 등)는 절대 넣지 마. 예: \"아우터 추천해줘\" → \"아우터\
            \ outer 자켓 jacket 코트 coat\"\n- 사용자가 보고 싶다고 한 브랜드가 있으면 그 브랜드 이름을 query에 넣어.\n- 검색어는 핵심 단어 위주로 15단어 이내로 써. 같은 단어를 반복하지 마.\n- 제외하라는 브랜드, \"말고\", \"빼고\", \"다른\", \"더\" 같은 표현, 가격 조건은 query에 넣지 마.\n- followup이 true면 이전 검색 조건의 query를 바탕으로, 새로 바뀐 조건만 반영해서 다시 써.\n\n## styles (스타일)\n- 사용자가 직접 쓴 분위기·스타일 단어만 한국어로 넣어. 없으면 []. 질문에 없는 스타일을 추측해서 넣지 마.\n- followup이 true이고 새 질문에 스타일이 없으면 이전 조건의 styles를 그대로 써.\n\n## category (카테고리)와 item (아이템)\n- item은 질문에 나온 아이템 종류를 사용자가 쓴 말 그대로 써. 예: 스니커즈, 원피스, 니트, 와이드 팬츠. 없으면 \"\".\n- category는 item이 상의, 하의(바지·치마), 아우터 중 어디인지 써. 가디건·카디건·블레이저·집업은 아우터야.\n- 신발, 원피스·드레스, 가방, 모자, 액세서리, 수영복처럼 상의·하의·아우터가 아닌 아이템만 찾으면 \"기타\"로 써.\n  단, \"부츠랑 어울리는 바지\"처럼 상의·하의·아우터를 찾는 질문이면 그 카테고리로 써. \"부츠컷\"은 바지 모양이라 하의야.\n- 아이템 종류를 알 수 없으면 \"\".\n- followup이 true이고 새 질문에 아이템 종류가 없으면 이전 조건의 category를 그대로 써.\n\n## brands (보고 싶은 브랜드)\n- \"브랜드A 자켓 보여줘\", \"브랜드B 바지 있어?\"처럼 그 브랜드의 상품을 보고 싶다고 한 브랜드 이름을 사용자가 쓴 그대로 넣어. 없으면 [].\n- 처음 듣는 이름이어도 브랜드나 쇼핑몰 이름으로 보이면 넣어. 아이템 이름, 스타일 단어, 색은 넣지 마.\n- \"\
            브랜드A 느낌\", \"브랜드A 같은\"처럼 분위기 기준으로만 말한 브랜드도 넣어 (코드가 구분한다).\n\n## exclude_brands (제외 브랜드)\n- 사용자가 \"빼고\", \"말고\", \"제외\", \"없이\", \"except\", \"without\"처럼 빼 달라는 말을 브랜드 이름과 함께 쓴 경우에만 그 브랜드 이름을 넣어. 그런 말이 없으면 반드시 [].\n- 예: \"브랜드A 제외하고\" → [\"브랜드A\"], \"브랜드A랑 브랜드B 빼고\" → [\"브랜드A\", \"브랜드B\"], \"브랜드A 말고 브랜드B도\" → [\"브랜드A\", \"브랜드B\"]\n- 예: \"브랜드A 자켓 보여줘\" → brands: [\"브랜드A\"], exclude_brands: [] (보여 달라는 브랜드를 제외에 넣지 마)\n- 이미 보여준 상품의 브랜드를 빼는 게 아니야.\n- followup이 true면 이전 조건의 제외 브랜드를 유지해. 사용자가 다시 포함해 달라고 하면 빼.\n"

          label: 브랜드 유사도
          name: '브랜드 유사도: 특정 브랜드 이름을 대고 그 브랜드와 분위기가 비슷한 "다른 브랜드"를 묻는 질문. 예: 코이세이오랑 비슷한 브랜드 알려줘, seezul 같은 브랜드 또 있어?, 마뗑킴 느낌 브랜드

            브랜드 이름과 함께 니트·자켓·바지 같은 아이템 종류를 말하면 여기가 아니라 상품 추천이다. 예: 코이세이오 니트 있어?, 로웨어 자켓 보여줘'
        - id: '2'
          label: 상품 추천
          name: '상품 추천: 옷이나 아이템을 찾거나 추천받는 질문. 아이템 종류, 색, 핏, 분위기, 가격 조건, 특정 브랜드를 빼거나 넣는 조건이 들어간 상품 검색. 예: 빈티지한 아우터, 10만원 이하 하의, 코이세이오 니트 있어?, 로웨어 자켓 보여줘, seezul 제외하고 빈티지한 아우터, 다른 거 더 보여줘, 다음 추천 보기

            "브랜드"를 추천해 달라는 질문은 여기로 분류하지 않는다. 아이템 종류(아우터, 바지, 셔츠 등)나 상품을 요청할 때만 여기로 분류한다.'
        - id: '3'
          label: 스타일로 브랜드 찾기
          name: '사용자가 특정 기준 브랜드 없이 스타일이나 분위기로 "브랜드"를 추천해 달라고 할 때.

            문장에 "브랜드"라는 단어가 있고, 상의·하의·아우터·바지·셔츠·자켓 같은 아이템 종류를 요청하지 않으면 여기로 분류한다.

            예: "빈티지 브랜드 추천해줘", "빈티지한 브랜드 추천해줘", "페미닌한 브랜드 알려줘", "미니멀한 느낌의 브랜드 있어?"'
        - id: '4'
          label: 취향 평가
          name: '취향 평가: 바로 앞에서 추천한 상품이나 브랜드, 스타일에 대해 좋다/별로다만 말하는 메시지. 예: 1번 좋아, 2번 별로, 1번 좋아 2번 별로 3번 좋아, 1번이랑 3번 마음에 들어, 로웨어 느낌 별로, 빈티지 쪽이 좋아, 1번 취소 (앞서 한 평가를 취소), 브랜드 저장 @lowear.co.kr, 브랜드 저장 취소 @lowear.co.kr (웹사이트의 브랜드 저장 버튼)'

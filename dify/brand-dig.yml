    - data:
        selected: false
        desc: ''
        title: 후보 이름 정리
        type: code
        code_language: python3
        code: "import json\nimport re\n\nMAX_LOOKUP = 4\n\n\ndef parse(text):\n    text = re.sub(r\"^```(?:json)?|```$\", \"\", (text or \"\").strip(), flags=re.M).strip()\n    m = re.search(r\"\\{[\\s\\S]*\\}\", text)\n    try:\n        data = json.loads(m.group(0)) if m else {}\n    except json.JSONDecodeError:\n        return []\n    items = data.get(\"brands\") if isinstance(data, dict) else None\n    return items if isinstance(items, list) else []\n\n\ndef main(llm_text: str) -> dict:\n    \"\"\"자사몰을 따로 검색할 후보 이름 (자사몰 확인 노드의 valid_items와 같은 순서)\"\"\"\n    items = [i for i in parse(llm_text) if isinstance(i, dict) and str(i.get(\"name_ko\") or i.get(\"name\") or \"\").strip()][:MAX_LOOKUP]\n    names = []\n    for i in items:\n        ko = str(i.get(\"name_ko\") or i.get(\"name\") or \"\").strip()\n        en = str(i.get(\"name_en\") or \"\").strip()\n        names.append(f\"{ko} {en}\".strip() if en and en.lower() != ko.lower() else ko)\n    return {\"names\": names}\n"
        variables:
        - value_selector:
          - pick
          - text
          value_type: string
          variable: llm_text
        outputs:
          names:
            children: null
            type: array[string]
